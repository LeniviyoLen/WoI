<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web of Illusions</title>
<style>
:root{
  --bg:#000; --text:#ece8f5; --muted:#9a93ad; --accent:#b48cff; --accent2:#5ee3ff;
  --panel:rgba(14,10,24,.78); --line:rgba(180,140,255,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;background:var(--bg) center/cover no-repeat;z-index:-1}
.hidden{display:none!important}
a{color:var(--accent2)}
.screen{min-height:100vh}

/* welcome */
#welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:20px}
.welcome-title{font-size:clamp(48px,10vw,140px);font-weight:800;letter-spacing:2px;line-height:1}
.welcome-title span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome-sub{color:var(--muted);letter-spacing:8px;text-transform:uppercase}
.hint{color:var(--muted);font-size:14px;max-width:460px}

/* cards & forms */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;backdrop-filter:blur(8px)}
#register{display:flex;align-items:center;justify-content:center;padding:20px}
#reg-form{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px}
label,.label{display:flex;flex-direction:column;gap:6px;font-weight:600}
small{font-weight:400;color:var(--muted)}
small.warn{color:#ff7a7a;font-weight:700}
input{background:#0b0912;border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:8px;font-size:15px}
input:focus{outline:none;border-color:var(--accent)}
.classes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cls-opt{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#0b0912;text-align:left;color:var(--text)}
.cls-opt b{display:block;margin-bottom:4px}
.cls-opt small{font-size:12px}
.cls-opt.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(180,140,255,.35)}
.btn{border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;color:var(--text)}
.btn.primary{background:linear-gradient(90deg,#7b4dff,#3cc4e6)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.pick{background:rgba(180,140,255,.15);border:1px dashed var(--accent);width:100%;margin-bottom:8px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(180,140,255,.5)}}

/* main */
#main{position:relative;padding:24px 24px 24px 96px}
.topbar{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:900;letter-spacing:3px}
.logo i{font-weight:300;color:var(--accent)}
.top-icons{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
.ico{width:40px;height:40px;border-radius:8px;border:0;background:transparent;color:var(--text);font-size:18px;cursor:pointer}
.ico:hover{background:rgba(255,255,255,.08)}
.ico img{width:24px;height:24px}
.sidebar{position:fixed;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.side-link{width:64px;height:64px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--text);text-decoration:none}
.side-link span{font-size:20px}
.side-link:hover{border-color:var(--accent)}

.panel{position:absolute;left:96px;bottom:24px;width:min(460px,calc(100% - 120px));max-height:calc(100vh - 120px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;backdrop-filter:blur(8px)}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.nick{font-size:24px;font-weight:800}
.cls{color:var(--muted);font-size:14px;margin-top:2px}
.cls b{color:var(--text)}
.lvl-badge{background:linear-gradient(135deg,#7b4dff,#3cc4e6);border-radius:10px;padding:6px 12px;font-weight:900;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0}
.stat{background:#0b0912;border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:800}
.stat.dom{border-color:var(--accent)} .stat.sub{border-color:rgba(94,227,255,.5)}
.lvl-row{display:flex;align-items:center;gap:10px;font-weight:800}
.bar{flex:1;height:10px;background:#1a1526;border-radius:6px;overflow:hidden}
#lv-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
.muted{color:var(--muted);font-size:13px;margin-top:6px}
.block{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.block-title{font-weight:800;margin-bottom:8px}
.cr{font-weight:900;color:var(--accent2)}
.skills{list-style:none;display:flex;flex-direction:column;gap:6px}
.skills li{background:#0b0912;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.skills li small{white-space:nowrap}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal-card{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:#0b0912;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:8px;cursor:pointer;font-size:15px}
.opt:hover{border-color:var(--accent)}

@media (max-width:720px){
  #main{padding:16px 16px 100px}
  .sidebar{top:auto;bottom:12px;left:50%;transform:translateX(-50%);flex-direction:row}
  .panel{position:static;width:100%;margin-top:16px;max-height:none}
  .logo{font-size:18px}
  .stats{grid-template-columns:repeat(5,1fr)}
}

</style>
</head>

<div id="bg"></div>

<!-- ЭКРАН ПРИВЕТСТВИЯ -->
<section id="welcome" class="screen">
  <h1 class="welcome-title">Welcome to <span>WoI</span></h1>
  <p class="welcome-sub">Web of Illusions</p>
  <button id="enter-btn" class="btn primary">Войти / Зарегистрироваться</button>
</section>

<!-- РЕГИСТРАЦИЯ -->
<section id="register" class="screen hidden">
  <form id="reg-form" class="card">
    <h2>Создание персонажа</h2>
    <label>Ник персонажа
      <input name="nick" required maxlength="32" placeholder="Например: Alfer">
      <small class="warn">⚠ Это ник В ИГРЕ, а НЕ твой ник в Telegram!</small>
    </label>
    <label>Ссылка на анкету
      <input name="profile" type="url" required placeholder="https://...">
    </label>
    <label>Когда ты зарегистрировался на сервере
      <input name="regDate" type="datetime-local" required>
      <small>От этой даты считается опыт и уровень. Указывай честно.</small>
    </label>
    <div class="label">Класс <small>(влияет на характеристики, сменить нельзя)</small></div>
    <div class="classes" id="class-pick"></div>
    <button type="submit" class="btn primary">Начать путь</button>
  </form>
</section>

<!-- ГЛАВНЫЙ ЭКРАН -->
<section id="main" class="screen hidden">
  <header class="topbar">
    <div class="logo">WEB <i>of</i> ILLUSIONS</div>
    <nav class="top-icons">
      <button class="ico" title="Почта">✉</button>
      <button class="ico" title="Уведомления">🔔</button>
      <button class="ico" title="Друзья">👥</button>
      <button class="ico" title="Настройки">⚙</button>
      <button class="ico" id="logout" title="Выйти">⏻</button>
    </nav>
  </header>

  <aside class="sidebar">
    <a id="lnk-life" target="_blank" rel="noopener" class="side-link"><span>✦</span>Лайф</a>
    <a id="lnk-tiktok" target="_blank" rel="noopener" class="side-link"><span>♪</span>TikTok</a>
    <a id="lnk-donate" target="_blank" rel="noopener" class="side-link"><span>♥</span>Донат</a>
  </aside>

  <div class="panel" id="stat-panel">
    <div class="panel-head">
      <div>
        <div class="nick" id="p-nick"></div>
        <div class="cls">Класс: <b id="p-class"></b> · <a id="p-profile" target="_blank" rel="noopener">анкета</a></div>
      </div>
      <div class="lvl-badge" id="p-lvl"></div>
    </div>

    <div class="stats" id="p-stats"></div>

    <div class="lvl-row">
      <span id="lv-cur"></span>
      <div class="bar"><div id="lv-fill"></div></div>
      <span id="lv-next"></span>
    </div>
    <div class="muted" id="p-days"></div>

    <div class="block">
      <div class="block-title">Доступная опасность монстров</div>
      <div id="p-monsters"></div>
    </div>

    <div class="block">
      <div class="block-title">Выбранные навыки</div>
      <div id="p-pick-btns"></div>
      <ul id="p-skills" class="skills"></ul>
    </div>
  </div>
</section>

<!-- МОДАЛКА ВЫБОРА НАВЫКА -->
<div id="modal" class="modal hidden">
  <div class="card modal-card">
    <h3 id="m-title">Выбери новый навык</h3>
    <p class="muted" id="m-note"></p>
    <div id="m-options" class="options"></div>
    <button class="btn ghost" id="m-close">Позже</button>
  </div>
</div>

<script>
(function(){
const CFG = window.WOI_CONFIG, D = window.WOI_DATA;
const $ = id => document.getElementById(id);
const MAX_LVL = 100, XP_PER_DAY = 100, DAY = 86400000;

const STATS = [["str","Сила"],["agi","Ловкость"],["int","Интеллект"],["wis","Мудрость"],["cha","Харизма"]];
const CLASSES = {
  berserk:{name:"Берсерк", rates:{str:.5,agi:.3,int:.1,wis:.1,cha:.1}, desc:"Тяжёлая броня, щит и меч, ближний бой",
           elemental:"Стихийное усиление оружия или брони (если есть стихия)"},
  archer: {name:"Лучник",  rates:{str:.1,agi:.5,int:.1,wis:.3,cha:.1}, desc:"Лёгкая/средняя броня, лук, дальний бой",
           elemental:"Стихийные стрелы или ловушки (если есть стихия)"},
  mage:   {name:"Маг",     rates:{str:.1,agi:.1,int:.5,wis:.3,cha:.1}, desc:"Заклинания и катализатор, базовое лечение"},
  hybrid: {name:"Гибрид",  rates:{str:.3,agi:.3,int:.1,wis:.1,cha:.3}, desc:"Средний во всём, без стихий и магии"}
};
const ELEMENTAL_LVLS = [25,60,90];

// ---------- storage ----------
const load = () => JSON.parse(localStorage.getItem("woi_chars") || "{}");
const save = all => localStorage.setItem("woi_chars", JSON.stringify(all));
const session = () => JSON.parse(localStorage.getItem("woi_session") || "null");
function getChar(){ const s = session(); return s ? load()[s.id] : null; }
function putChar(c){ const all = load(); all[session().id] = c; save(all); }

// ---------- math ----------
const xpForLevel = L => 100 * Math.pow(L - 1, 1.5);
function calc(c){
  const days = Math.max(0, (Date.now() - new Date(c.regDate).getTime()) / DAY);
  const bonus = Number((CFG.bonusXp || {})[c.nick] || 0);
  const xp = days * XP_PER_DAY + bonus;
  let lvl = 1;
  while (lvl < MAX_LVL && xp >= xpForLevel(lvl + 1) - 1e-9) lvl++;
  const res = {days, xp, lvl};
  if (lvl < MAX_LVL){
    const a = xpForLevel(lvl), b = xpForLevel(lvl + 1);
    res.progress = (xp - a) / (b - a);
    res.daysLeft = (b - xp) / XP_PER_DAY;
  } else { res.progress = 1; res.daysLeft = 0; }
  const r = CLASSES[c.cls].rates;
  res.stats = {};
  STATS.forEach(([k]) => res.stats[k] = 10 + r[k] * (lvl - 1));
  return res;
}
const fmt = n => (Math.round(n * 10) / 10).toString().replace(".", ",");
function plural(n, a, b, c){ n = Math.floor(Math.abs(n)); const m10=n%10, m100=n%100;
  return m10==1&&m100!=11 ? a : (m10>=2&&m10<=4&&(m100<10||m100>=20) ? b : c); }

// ---------- screens ----------
function show(id){ ["welcome","register","main"].forEach(s => $(s).classList.toggle("hidden", s !== id)); }

function route(){
  if (!session()) return showWelcome();
  if (!getChar()) return showRegister();
  showMain();
}

function showWelcome(){
  show("welcome");
  $("enter-btn").onclick = () => {
    localStorage.setItem("woi_session", JSON.stringify({id:"local"}));
    route();
  };
}

let pickedClass = null;
function showRegister(){
  show("register");
  const box = $("class-pick"); box.innerHTML = "";
  Object.entries(CLASSES).forEach(([k, c]) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "cls-opt";
    b.innerHTML = `<b>${c.name}</b><small>${c.desc}</small>`;
    b.onclick = () => { pickedClass = k; [...box.children].forEach(x => x.classList.remove("active")); b.classList.add("active"); };
    box.appendChild(b);
  });
  const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  $("reg-form").regDate.max = now.toISOString().slice(0,16);
}
$("reg-form").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (!pickedClass) return alert("Выбери класс");
  const reg = new Date(f.regDate.value);
  if (isNaN(reg) || reg > new Date()) return alert("Дата регистрации не может быть в будущем");
  if (!confirm(`Класс «${CLASSES[pickedClass].name}» и дату регистрации потом сменить нельзя. Всё верно?`)) return;
  putChar({nick:f.nick.value.trim(), profile:f.profile.value.trim(), cls:pickedClass,
           regDate:reg.toISOString(), skills:[], created:new Date().toISOString()});
  showMain();
});

function monsterFor(lvl){
  let m = D.monsters[0];
  D.monsters.forEach(x => { if (x.lvl <= lvl) m = x; });
  return m;
}
function pendingTiers(c, lvl){
  const taken = new Set(c.skills.map(s => s.tier));
  const t = []; for (let L = 5; L <= lvl; L += 5) if (!taken.has(L)) t.push(L);
  return t;
}

function showMain(){
  show("main");
  const c = getChar(), r = calc(c), cl = CLASSES[c.cls];
  $("p-nick").textContent = c.nick;
  $("p-class").textContent = cl.name;
  $("p-profile").href = c.profile;
  $("p-lvl").textContent = `LVL ${r.lvl}`;

  $("p-stats").innerHTML = STATS.map(([k, n]) => {
    const role = cl.rates[k] === .5 ? "dom" : cl.rates[k] === .3 ? "sub" : "";
    return `<div class="stat ${role}"><div class="k">${n}</div><div class="v">${fmt(r.stats[k])}</div></div>`;
  }).join("");

  $("lv-cur").textContent = r.lvl;
  $("lv-next").textContent = r.lvl < MAX_LVL ? r.lvl + 1 : "MAX";
  $("lv-fill").style.width = (r.progress * 100).toFixed(1) + "%";
  const d = Math.floor(r.days);
  $("p-days").textContent = r.lvl < MAX_LVL
    ? `Прошло ${d} ${plural(d,"день","дня","дней")} / до нового лвл ${fmt(r.daysLeft)} ${plural(Math.ceil(r.daysLeft),"день","дня","дней")}`
    : `Прошло ${d} ${plural(d,"день","дня","дней")} · максимальный уровень`;

  const m = monsterFor(r.lvl);
  $("p-monsters").innerHTML = `Опасность (CR): <span class="cr">${m.cr}</span><div class="muted">${m.ex}</div>`;

  const pend = pendingTiers(c, r.lvl);
  $("p-pick-btns").innerHTML = "";
  pend.forEach(t => {
    const b = document.createElement("button"); b.className = "btn pick";
    b.textContent = "＋ Выбрать новый навык"; b.onclick = () => openPick(t);
    $("p-pick-btns").appendChild(b);
  });
  $("p-skills").innerHTML = c.skills.length
    ? c.skills.slice().sort((a,b) => a.tier - b.tier).map(s => `<li>${s.name}<small class="muted">${s.tier} лвл</small></li>`).join("")
    : (pend.length ? "" : `<li class="muted">Пока пусто. Первый навык на 5 лвл.</li>`);
}

function openPick(tier){
  const c = getChar(), cl = CLASSES[c.cls];
  const opts = (D.skills[c.cls][tier] || []).slice();
  if (cl.elemental && ELEMENTAL_LVLS.includes(tier)) opts.push(cl.elemental);
  $("m-title").textContent = "Выбери новый навык";
  $("m-note").textContent = "Выбор навсегда, изменить потом нельзя.";
  const box = $("m-options"); box.innerHTML = "";
  opts.forEach(name => {
    const b = document.createElement("button"); b.className = "opt"; b.textContent = name;
    b.onclick = () => {
      if (!confirm(`Взять «${name}»? Отменить будет нельзя.`)) return;
      const ch = getChar();
      if (ch.skills.some(s => s.tier === tier)) return closeModal();
      ch.skills.push({tier, name, at:new Date().toISOString()}); putChar(ch);
      closeModal(); showMain();
    };
    box.appendChild(b);
  });
  $("modal").classList.remove("hidden");
}
function closeModal(){ $("modal").classList.add("hidden"); }
$("m-close").onclick = closeModal;
$("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
$("logout").onclick = () => { localStorage.removeItem("woi_session"); route(); };

// ---------- init ----------
if (CFG.background){ const bg = $("bg"); bg.style.backgroundImage = `url("${CFG.background}")`; }
$("lnk-life").href = CFG.links.life; $("lnk-tiktok").href = CFG.links.tiktok; $("lnk-donate").href = CFG.links.donate;
setInterval(() => { if (!$("main").classList.contains("hidden") && $("modal").classList.contains("hidden")) showMain(); }, 60000);
route();
})();

</script>
